<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Cotação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
    <body>

        <div class="d-flex">
            <div  th:replace="~{fragments/sidebarColab :: sidebarColab}"></div>

            <div class="content w-100">

                <nav th:replace="~{fragments/navbar :: navbar}"></nav>
                
                    <main class="main-content container-fluid">

                        <div id="cabecalho" class="mb-4">

                            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

                                <div>

                                    <h2 class="fw-bold mb-1">
                                        Minhas Cotações
                                    </h2>

                                    <p class="text-muted mb-0">
                                        Gerencie todas as cotações cadastradas no portal.
                                    </p>

                                </div>

                                <div>

                                    <button class="btn btn-primary-custom">
                                        <i class="bi bi-plus-circle me-2"></i>
                                        Nova Cotação
                                    </button>

                                </div>

                            </div>

                        </div>

                        <div class="table-card mb-4">

                            <div class="row g-3">

                                <div class="col-lg-4">

                                    <label class="form-label fw-semibold">
                                        Buscar
                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">
                                            <i class="bi bi-search"></i>
                                        </span>

                                        <input
                                                type="text"
                                                class="form-control"
                                                placeholder="Código ou título da cotação">

                                    </div>

                                </div>

                                <div class="col-md-4 col-lg-3">

                                    <label class="form-label fw-semibold">
                                        Status
                                    </label>

                                    <select class="form-select">

                                        <option>Todos</option>
                                        <option>Pendente</option>
                                        <option>Em andamento</option>
                                        <option>Finalizada</option>
                                        <option>Cancelada</option>

                                    </select>

                                </div>

                                <div class="col-md-4 col-lg-3">

                                    <label class="form-label fw-semibold">
                                        Data
                                    </label>

                                    <input type="date" class="form-control">

                                </div>

                                <div class="col-lg-2 d-grid align-self-end">

                                    <button class="btn btn-outline-secondary">

                                        <i class="bi bi-funnel me-2"></i>

                                        Filtrar

                                    </button>

                                </div>

                            </div>

                        </div>
                        
                        <div class="table-card">

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <h5 class="fw-semibold mb-0">
                                    Lista de Cotações
                                </h5>

                                <span class="text-muted">
                                    0 registros
                                </span>

                            </div>

                            <div class="table-responsive">

                                <table class="table align-middle">

                                    <thead>

                                        <tr>

                                            <th>Código</th>
                                            <th>Título</th>
                                            <th>Fornecedor(s)</th>
                                            <th>Criação</th>
                                            <th>Validade</th>
                                            <th>Status</th>
                                            <th class="text-center">Ações</th>

                                        </tr>

                                    </thead>

                                    <tbody>

                                        <tr>

                                            <td colspan="7" class="text-center py-5 text-muted">

                                                <i class="bi bi-folder2-open fs-1 d-block mb-3"></i>

                                                <h5 class="mb-2">
                                                    Nenhuma cotação encontrada
                                                </h5>

                                                <p class="mb-4">
                                                    Crie uma nova cotação para começar.
                                                </p>

                                                <button class="btn btn-primary-custom">

                                                    <i class="bi bi-plus-circle me-2"></i>

                                                    Nova Cotação

                                                </button>

                                            </td>

                                        </tr>

                                        <!-- Exemplo quando houver dados

                                        <tr>

                                            <td>CT-0001</td>

                                            <td>Materiais Elétricos</td>

                                            <td>5</td>

                                            <td>15/07/2026</td>

                                            <td>22/07/2026</td>

                                            <td>

                                                <span class="badge-status pending">
                                                    Pendente
                                                </span>

                                            </td>

                                            <td class="text-center">

                                                <button class="btn btn-sm btn-outline-primary">
                                                    <i class="bi bi-eye"></i>
                                                </button>

                                                <button class="btn btn-sm btn-outline-success">
                                                    <i class="bi bi-pencil"></i>
                                                </button>

                                                <button class="btn btn-sm btn-outline-danger">
                                                    <i class="bi bi-trash"></i>
                                                </button>

                                            </td>

                                        </tr>

                                        -->

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    </main>

                 <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </div>

        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
