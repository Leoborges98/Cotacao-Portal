<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Cotação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
    <body>

        <div class="d-flex">
            <div  th:replace="~{fragments/sidebarColab :: sidebarColab}"></div>

            <div class="content w-100">

                <nav th:replace="~{fragments/navbar :: navbar}"></nav>
                
                    <main class="col-lg-10 col-md-9 p-4">

                        <!-- Título -->
                        <div class="mb-4">
                            <h2 class="fw-bold">Nova Cotação</h2>
                        </div>

                        <!-- Wizard -->
                        <div class="card shadow-sm rounded-4 border-0 mb-4">

                            <div class="card-body">

                                <div class="d-flex justify-content-between align-items-center">

                                    <div class="text-center flex-fill">
                                        <div class="rounded-circle bg-primary text-white mx-auto d-flex align-items-center justify-content-center"
                                            style="width:40px;height:40px;">
                                            1
                                        </div>

                                        <small class="fw-semibold">Dados</small>
                                    </div>

                                    <div class="flex-fill border-top"></div>

                                    <div class="text-center flex-fill">
                                        <div class="rounded-circle bg-secondary text-white mx-auto d-flex align-items-center justify-content-center"
                                            style="width:40px;height:40px;">
                                            2
                                        </div>

                                        <small>Upload</small>
                                    </div>

                                    <div class="flex-fill border-top"></div>

                                    <div class="text-center flex-fill">
                                        <div class="rounded-circle bg-secondary text-white mx-auto d-flex align-items-center justify-content-center"
                                            style="width:40px;height:40px;">
                                            3
                                        </div>

                                        <small>Fornecedores</small>
                                    </div>

                                    <div class="flex-fill border-top"></div>

                                    <div class="text-center flex-fill">
                                        <div class="rounded-circle bg-secondary text-white mx-auto d-flex align-items-center justify-content-center"
                                            style="width:40px;height:40px;">
                                            4
                                        </div>

                                        <small>Revisão</small>
                                    </div>

                                    <div class="flex-fill border-top"></div>

                                    <div class="text-center flex-fill">
                                        <div class="rounded-circle bg-secondary text-white mx-auto d-flex align-items-center justify-content-center"
                                            style="width:40px;height:40px;">
                                            5
                                        </div>

                                        <small>Enviar</small>
                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- Conteúdo da Etapa -->
                        <div class="card shadow-sm rounded-4 border-0">

                            <div class="card-header bg-white border-0 pt-4">

                                <h4 class="fw-bold mb-0">
                                    Dados da Cotação
                                </h4>

                            </div>

                            <div class="card-body">

                                <div class="row">

                                    <div class="col-md-4 mb-3">

                                        <label class="form-label">
                                            Código
                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            placeholder="Gerado automaticamente">

                                    </div>

                                    <div class="col-md-8 mb-3">

                                        <label class="form-label">
                                            Nome da Cotação
                                        </label>

                                        <input type="text"
                                            class="form-control"
                                            placeholder="Ex.: Compra de Materiais">

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        Descrição
                                    </label>

                                    <textarea class="form-control"
                                            rows="4"
                                            placeholder="Informe uma descrição para esta cotação..."></textarea>

                                </div>

                                <div class="row">

                                    <div class="col-md-4">

                                        <label class="form-label">
                                            Data Limite
                                        </label>

                                        <input type="date"
                                            class="form-control">

                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- Botões -->
                        <div class="d-flex justify-content-between mt-4">

                            <button class="btn btn-outline-secondary">

                                Cancelar

                            </button>

                            <button class="btn btn-primary">

                                Próximo

                            </button>

                        </div>

                    </main>

                 <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </div>

        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
