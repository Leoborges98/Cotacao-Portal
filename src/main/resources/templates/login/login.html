<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Portal Leiroz & Vieira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="login-container" class="login-container">
    <div class="login-box">

        <img src="/img/logo.png" alt="Logo da empresa" class="logo">

        <h2 class="titulo">Bem-vindo ao Portal</h2>

        <form id="login-form" th:action="@{/login}" method="post">
            <select name="role" required>
                <option value="colaborador">Colaborador</option>
                <option value="fornecedor">Fornecedor</option>
            </select>

            <input  type="hidden"
         placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>

            <button type="submit">Entrar</button>

            <a href="#" class="link">Esqueci minha senha</a>

            <p class="trocar">
                Não tem conta?
                <a th:href="@{/cadastro}">Cadastrar-se</a>
            </p>
        </form>

    </div>
</div>



<script th:src="@{/js/script.js}"></script>

</body>

</html>
