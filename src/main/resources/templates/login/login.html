<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text="${titulo}">Portal Leiroz & Vieira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
    
</head>
<body>

<!-- ===================== TELA DE LOGIN ===================== -->
<div id="login-container" class="login-container">
    <div class="login-box">

        <img src="/img/logo.png" alt="Logo da empresa" class="logo">

        <h2 class="titulo">Bem-vindo ao Portal</h2>

        <form id="login-form" method="post" action="login">
            <select name="role" required>
                <option value="colaborador">Colaborador</option>
                <option value="fornecedor">Fornecedor</option>
            </select>

            <input type="text" name="username" placeholder="Usuário" required>
            <input type="password" name="password" placeholder="Senha" required>

            <button type="submit">Entrar</button>

            <a href="#" class="link">Esqueci minha senha</a>

            <p class="trocar">
                Não tem conta?
                <a href="#" onclick="mostrarCadastro()">Cadastrar-se</a>
            </p>
        </form>

    </div>
</div>

<!-- ===================== TELA DE CADASTRO ===================== -->
<div id="cadastro-container" class="login-container" style="display: none;">
    <div class="login-box">

        <img src="/img/logo.png" alt="Logo da empresa" class="logo">

        <h2 class="titulo">Criar Conta</h2>

        <form id="cadastro-form" method="post" th:action="@{/cadastro}">
            <select id="tipo-cadastro" required>
                <option value="colaborador">Colaborador</option>
                <option value="fornecedor">Fornecedor</option>
            </select>

            <input type="text" id="nome-cadastro" placeholder="Nome" required>
            <input type="email" id="email-cadastro" placeholder="E-mail" required>
            <input type="password" id="senha-cadastro" placeholder="Senha" required>

            <button type="submit">Cadastrar</button> 

            <p class="trocar">
                Já tem conta?
                <a href="#" onclick="mostrarLogin()">Entrar</a>
            </p>
        </form>

    </div>
</div>

<script th:src="@{/js/script.js}"></script>

</body>

</html>
